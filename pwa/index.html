<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Träningsnärvaro</title>
    <meta name="description" content="Mobil träningsnärvaro kopplad till Google Sheet.">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Närvaro GS">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f1f5f9;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        max-width: 340px;
        padding: 32px 24px;
        text-align: center;
      }
      .logo {
        width: 96px; height: 96px;
        border-radius: 22px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
      .install {
        font-size: 14px;
        line-height: 1.6;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 24px;
        text-align: left;
      }
      .install ol { margin: 6px 0 0 20px; }
      .openLink { font-size: 13px; color: #475569; margin-top: 20px; }
      .openLink b { color: #2563eb; }
      .hint { display: block; margin-top: 14px; font-size: 12px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="icon-192.png" alt="Appikon">
      <h1>Träningsnärvaro</h1>
      <div class="install" id="install">
        Installera appen på hemskärmen:
      </div>
      <span class="openLink" id="openLink">
        Vill du bara använda appen nu? <a id="openBtn" href="#">Logga in</a>
      </span>
      <span class="hint">Inloggning sker hos Google som vanligt — inget lösenord lagras här.</span>
    </div>
    <script>
      // App URL is injected at deploy time by substituting %APP_URL%.
      var APP_URL = "%APP_URL%";
      var params = new URLSearchParams(window.location.search);
      var landing = APP_URL;

      // Platform-specific, one-line install instruction
      var ua = navigator.userAgent || "";
      var steps;
      if (/iPhone|iPad|iPod/i.test(ua)) {
        steps =
          "<li>Tryck på <strong>Dela</strong>-knappen (square med pil uppåt) i Safari nertill</li>" +
          "<li>Välj <strong>Lägg till på hemskärmen</strong></li>" +
          "<li>Tryck på <strong>Lägg till</strong> — appen installerar sig med ikonen ovan</li>";
      } else if (/Android/i.test(ua)) {
        steps =
          "<li>Tryck på menyn <strong>⁝</strong> uppe till höger i Chrome</li>" +
          "<li>Välj <strong>Lägg till på startskärmen</strong></li>" +
          "<li>Bekräfta <strong>Installera</strong> — appen installeras med ikonen ovan</li>";
      } else {
        steps =
          "<li>Öppna sidan i Safari (iPhone) eller Chrome (Android)</li>" +
          "<li>Välj <strong>Lägg till på hem-/startskärmen</strong> i webbläsarens meny</li>";
      }
      document.getElementById("install").innerHTML =
        "Installera appen på hemskärmen:" +
        "<ol>" + steps + "</ol>";

      // First visit: show the landing card so the user can Add to Home Screen
      // while this page (and its icon) is the active one. Returning visit
      // (opened from the home-screen icon): redirect straight to the app.
      var seen = null;
      try { seen = localStorage.getItem("pwaSeen"); } catch (e) {}
      if (params.get("open") === "1" || seen === "1") {
        window.location.replace(landing);
      } else {
        try { localStorage.setItem("pwaSeen", "1"); } catch (e) {}
        document.getElementById("openBtn").href = landing + "?open=1";
      }
    </script>
  </body>
</html>
