<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Träningsnärvaro</title>
    <meta name="description" content="Mobil träningsnärvaro kopplad till Google Sheet.">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Närvaro GS">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f1f5f9;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        max-width: 340px;
        padding: 32px 24px;
        text-align: center;
      }
      .logo {
        width: 96px; height: 96px;
        border-radius: 22px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
      p  { font-size: 14px; color: #475569; line-height: 1.5; margin-bottom: 24px; }
      .open-btn {
        display: inline-block;
        width: 100%;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        color: #ffffff;
        background-color: #2563eb;
        border: none;
        border-radius: 10px;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }
      .open-btn:active { background-color: #1d4ed8; }
      .hint { display: block; margin-top: 16px; font-size: 12px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="icon-192.png" alt="Appikon">
      <h1>Träningsnärvaro</h1>
      <p>
        Appen öppnas i Google-appen du redan är inloggad i.
        Tryck nedan för att öppna den — på iPhone: använd sedan
        <strong>Dela → Lägg till på hemskärmen</strong> för en appikon.
      </p>
      <a class="open-btn" id="openBtn" href="#">Öppna appen</a>
      <span class="hint">Du loggar in hos Google som vanligt — inget lösenord lagras här.</span>
    </div>
    <script>
      // App URL is injected at deploy time by substituting %APP_URL%.
      var APP_URL = "%APP_URL%";
      var params = new URLSearchParams(window.location.search);
      var target = params.get("open");
      var landing = APP_URL;
      // First visit: show the landing card so the user can Add to Home Screen
      // while this page (and its icon) is the active one. Returning visit
      // (opened from the home-screen icon): redirect straight to the app.
      var seen = null;
      try { seen = localStorage.getItem("pwaSeen"); } catch (e) {}
      if (target === "1" || seen === "1") {
        window.location.replace(landing);
      } else {
        try { localStorage.setItem("pwaSeen", "1"); } catch (e) {}
        document.getElementById("openBtn").href = landing + "?open=1";
      }
    </script>
  </body>
</html>
